<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#07080a"/>
    </radialGradient>
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e3e6e1"/>
      <stop offset="100%" stop-color="#b0b5ad"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark CRT Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="8"/>
  
  <!-- Subtle CRT Phosphor Accent Ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="rgba(255, 42, 42, 0.35)" stroke-width="3"/>

  <!-- Elegant Letter 'R' Vector -->
  <path d="M 156 112 H 264 C 336 112 376 144 376 202 C 376 250 344 280 292 292 L 384 396 H 312 L 232 296 H 216 V 396 H 156 V 112 Z M 216 160 V 248 H 258 C 294 248 316 234 316 204 C 316 174 294 160 258 160 H 216 Z" fill="url(#rGrad)" filter="url(#glow)"/>

  <!-- Red CRT Phosphor Indicator Dot -->
  <circle cx="380" cy="132" r="16" fill="#ff2a2a"/>
</svg>