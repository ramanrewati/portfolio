<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark CRT Enclosure Gradient -->
    <radialGradient id="bezelGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="70%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#040507"/>
    </radialGradient>

    <!-- CRT Screen Phosphor Gradient -->
    <radialGradient id="screenGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1c2420"/>
      <stop offset="60%" stop-color="#0c120e"/>
      <stop offset="100%" stop-color="#060907"/>
    </radialGradient>

    <!-- Phosphor Glow Effect -->
    <filter id="phosphorGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4" x2="100" y2="4" stroke="rgba(0, 0, 0, 0.35)" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Outer CRT Enclosure Bezel -->
  <rect x="16" y="16" width="480" height="480" rx="90" fill="url(#bezelGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6"/>

  <!-- Inner CRT Curved Glass Screen -->
  <rect x="48" y="48" width="416" height="390" rx="50" fill="url(#screenGrad)" stroke="rgba(0, 255, 102, 0.25)" stroke-width="4"/>

  <!-- Scanline Overlay -->
  <rect x="48" y="48" width="416" height="390" rx="50" fill="url(#scanlines)"/>

  <!-- CRT Screen Glare Reflection -->
  <path d="M 60 70 Q 256 120 452 70 Q 430 180 60 70 Z" fill="rgba(255, 255, 255, 0.04)"/>

  <!-- Glowing Initial 'R' in Phosphor Green & White -->
  <path d="M 176 140 H 280 C 344 140 376 168 376 218 C 376 260 348 286 304 296 L 380 380 H 316 L 248 298 H 228 V 380 H 176 V 140 Z M 228 184 V 256 H 272 C 304 256 324 244 324 220 C 324 196 304 184 272 184 H 228 Z" 
        fill="#e3e6e1" 
        filter="url(#phosphorGlow)"/>

  <!-- Red CRT Power/Signal LED -->
  <circle cx="410" cy="458" r="10" fill="#ff2a2a" filter="url(#phosphorGlow)"/>
  <!-- Green Power Sync LED -->
  <circle cx="380" cy="458" r="8" fill="#00ff66"/>
</svg>